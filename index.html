<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วันนี้กินอะไรดี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* โทเคนจาก .claude/DESIGN.md (sweetgreen style) */
  :root {
    --deep-forest: #00473c;
    --lime-glow: #e6ff55;
    --sage-mist: #d8e5d6;
    --warm-sand: #e8dcc6;
    --cream: #f4f3e7;
    --ink: #0e150e;
    --warm-gray: #8c8c82;
    --slate: #555555;
    --shadow-xl: rgba(14, 21, 14, 0.4) 3px 3px 32px -10px;
    --font: "Noto Sans Thai", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    --max: 1200px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: .017em;
  }
  button, select, input { font: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--deep-forest); outline-offset: 3px; }
  .inner { max-width: var(--max); margin: 0 auto; padding: 0 20px; }

  /* ปุ่มพิล (รูปทรงเดียวของปุ่มทั้งหมด) */
  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 9999px; font-weight: 700; text-decoration: none;
    padding: 12px 20px; min-height: 44px;
    background: transparent; color: var(--deep-forest); border: 2px solid var(--deep-forest);
  }
  .pill:hover { background: var(--deep-forest); color: var(--cream); }
  .pill-primary { background: var(--lime-glow); color: var(--ink); border-color: var(--lime-glow); font-size: 18px; padding: 16px 24px; }
  .pill-primary:hover { background: var(--lime-glow); color: var(--ink); box-shadow: var(--shadow-xl); }
  .pill:disabled { opacity: .6; cursor: default; }
  .link {
    background: none; border: 0; padding: 0; color: var(--ink);
    font-weight: 700; text-align: left;
  }
  .link:hover { text-decoration: underline; }

  /* แถบนำทาง */
  .nav { background: var(--cream); }
  .nav .inner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 72px; }
  .nav a.nav-link { color: var(--ink); font-weight: 700; font-size: 14px; letter-spacing: .05em; text-decoration: none; }
  .nav a.nav-link:hover { text-decoration: underline; }
  .logo { color: var(--deep-forest); font-weight: 700; font-size: 24px; text-decoration: none; }
  .nav-r { justify-self: end; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  #authForm { display: grid; gap: 12px; margin-top: 16px; }
  #authForm input { padding: 10px 12px; font: inherit; border: 2px solid var(--deep-forest); border-radius: 8px; }
  .nav .pill { justify-self: end; padding: 8px 16px; min-height: 40px; font-size: 14px; letter-spacing: .05em; }

  /* ฮีโร่ = ผลสุ่มเมนู */
  .hero { position: relative; display: flex; align-items: flex-end; min-height: 600px; background: var(--sage-mist); overflow: hidden; }
  .hero-media { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .hero-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-media .ph { font-size: 12rem; line-height: 1; }
  .panel {
    position: relative; z-index: 1;
    background: rgba(244, 243, 231, .92);
    margin: 0 0 40px max(20px, calc((100vw - var(--max)) / 2 + 20px));
    padding: 40px; width: min(560px, calc(100% - 40px));
  }
  .eyebrow { font-weight: 700; font-size: 14px; letter-spacing: .05em; margin: 0 0 16px; color: var(--deep-forest); }
  .pick-name {
    font-weight: 400; font-size: clamp(2.6rem, 9vw, 4.4rem);
    line-height: 1.1; /* ภาษาไทยมีสระ/วรรณยุกต์ ใช้ 0.85 แล้วจะซ้อนกัน */
    letter-spacing: 0; margin: 0 0 8px; overflow-wrap: anywhere;
  }
  .pick-desc { margin: 0 0 12px; max-width: 34em; min-height: 3em; }
  .pick-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 20px; font-size: 14px; }
  .pick-meta .pill { padding: 6px 14px; min-height: 36px; font-size: 14px; }
  .pick-heart[aria-pressed="true"] { background: var(--deep-forest); color: var(--cream); }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  .opt { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
  .opt input { width: 20px; height: 20px; accent-color: var(--deep-forest); }
  .note { margin: 12px 0 0; min-height: 1.5em; font-size: 14px; }

  /* ส่วนเนื้อหา */
  .band { padding: 80px 0; }
  .band-sage { background: var(--sage-mist); }
  h2.section-title {
    font-weight: 400; font-size: clamp(2.2rem, 6vw, 3rem); line-height: 1.15;
    letter-spacing: 0; margin: 0 0 24px;
  }

  .tabs { display: flex; gap: 40px; overflow-x: auto; padding: 4px 0 16px; margin-bottom: 8px; }
  .tab {
    flex: none; position: relative; background: none; border: 0; padding: 0 0 14px;
    color: var(--ink); font-weight: 400; font-size: clamp(1.5rem, 4vw, 2.5rem); line-height: 1.2; letter-spacing: 0;
  }
  .tab[aria-pressed="true"]::after {
    content: ""; position: absolute; left: 50%; bottom: 0; width: 8px; height: 8px;
    border-radius: 50%; background: var(--ink); transform: translateX(-50%);
  }

  .search { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin: 0 0 16px; }
  .search input[type="search"], .search select {
    background: var(--cream); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 8px;
    padding: 8px 12px; min-height: 44px;
  }
  .search input[type="search"] { flex: 1 1 260px; }
  .count { margin: 0 0 24px; color: var(--slate); font-size: 14px; }
  .btn-clear { background: none; border: 0; padding: 0 4px; color: var(--deep-forest); text-decoration: underline; font-weight: 700; }

  /* การ์ดเมนู: รูปคือการ์ด ไม่มีพื้นหลัง เส้นขอบ หรือเงา */
  .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 40px 24px; }
  .card-img { aspect-ratio: 1; border-radius: 20px; overflow: hidden; background: var(--sage-mist); }
  .band-sage .card-img { background: var(--warm-sand); }
  .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 5rem; line-height: 1; }
  .card-body { padding: 16px 0 0; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-name { margin: 0; font-weight: 700; font-size: 20px; line-height: 1.3; letter-spacing: .03em; }
  .card-meta { margin: 4px 0 8px; font-size: 14px; color: var(--slate); }
  .card-desc { margin: 0 0 16px; }
  .heart {
    flex: none; background: none; border: 0; padding: 0 4px; min-width: 44px; min-height: 44px; margin: -8px -8px 0 0;
    font-size: 1.6rem; line-height: 1; color: var(--ink);
  }
  .heart[aria-pressed="true"] { color: var(--deep-forest); }
  .empty { grid-column: 1 / -1; padding: 24px 0; color: var(--slate); }

  footer { background: var(--deep-forest); color: var(--cream); padding: 40px 0; font-size: 14px; }

  dialog {
    background: var(--cream); color: var(--ink);
    border: 0; border-radius: 24px; box-shadow: var(--shadow-xl);
    padding: 24px; width: min(560px, calc(100vw - 32px)); max-height: 88vh;
  }
  dialog::backdrop { background: rgba(14, 21, 14, .55); }
  dialog h2 { margin: 0; font-weight: 400; font-size: 2rem; line-height: 1.15; letter-spacing: 0; }
  dialog h3 { font-size: 14px; font-weight: 700; letter-spacing: .05em; margin: 20px 0 8px; color: var(--deep-forest); }
  dialog p { margin: 8px 0; }
  .detail-top { display: flex; align-items: center; gap: 16px; }
  .detail-icon { flex: none; width: 88px; height: 88px; border-radius: 20px; overflow: hidden; background: var(--sage-mist); }
  .detail-icon .ph { font-size: 3rem; }
  .detail-meta { color: var(--slate); margin: 2px 0 0; font-size: 14px; }
  .chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chips li { border: 2px solid var(--deep-forest); border-radius: 9999px; padding: 2px 14px; font-size: 14px; }
  .chips.warn li { background: var(--deep-forest); color: var(--cream); font-weight: 700; }
  .btn-close { margin-top: 24px; }

  @media (max-width: 719px) {
    .nav .inner { grid-template-columns: auto 1fr; gap: 12px; }
    .nav a.nav-link { display: none; }
    .logo { font-size: 20px; }
    .hero { display: block; min-height: 0; }
    .hero-media { position: static; height: 300px; }
    .hero-media .ph { font-size: 8rem; }
    .panel { margin: 0; width: 100%; background: var(--cream); padding: 24px 20px 32px; }
    .band { padding: 56px 0; }
    .tabs { gap: 24px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .pill, .link { transition: background-color .15s, box-shadow .15s; }
  }
</style>
</head>
<body>
<header class="nav">
  <div class="inner">
    <a class="nav-link" href="#menu">เมนูทั้งหมด</a>
    <a class="logo" href="#top">วันนี้กินอะไรดี</a>
    <div class="nav-r">
      <a class="pill" href="#favs">รายการโปรด</a>
      <button class="pill" id="authBtn" type="button">สมัครสมาชิก / เข้าสู่ระบบ</button>
    </div>
  </div>
</header>

<section class="hero" id="top" aria-label="ผลสุ่มเมนู">
  <div class="hero-media" id="heroMedia" aria-hidden="true"><span class="ph">🍛</span></div>
  <div class="panel">
    <p class="eyebrow">วันนี้กินอะไรดี</p>
    <div id="pickBody" aria-live="polite">
      <h1 class="pick-name">สุ่มเมนูให้หน่อย</h1>
      <p class="pick-desc">กดปุ่มด้านล่าง เดี๋ยวเลือกให้หนึ่งเมนู</p>
    </div>
    <div class="hero-actions">
      <button class="pill pill-primary" id="randomBtn" type="button">สุ่มเมนูวันนี้</button>
      <label class="opt"><input type="checkbox" id="onlyFav"> สุ่มจากรายการโปรดเท่านั้น</label>
    </div>
    <p class="note" id="note" role="status"></p>
  </div>
</section>

<section class="band band-sage" id="favs">
  <div class="inner">
    <h2 class="section-title">รายการโปรดของฉัน</h2>
    <div id="favList"></div>
  </div>
</section>

<main class="band" id="menu">
  <div class="inner">
    <h2 class="section-title">เมนูทั้งหมด</h2>
    <div class="tabs" id="filters" role="group" aria-label="กรองตามหมวด"></div>
    <div class="search">
      <input type="search" id="q" placeholder="ค้นหาชื่อเมนูหรือวัตถุดิบ เช่น กุ้ง หมูสับ" aria-label="ค้นหาเมนู" autocomplete="off">
      <select id="spiceSel" aria-label="กรองตามระดับความเผ็ด">
        <option value="">ทุกระดับความเผ็ด</option>
        <option value="0">ไม่เผ็ด</option>
        <option value="1">เผ็ดน้อย 🌶️</option>
        <option value="2">เผ็ดกลาง 🌶️🌶️</option>
        <option value="3">เผ็ดมาก 🌶️🌶️🌶️</option>
      </select>
      <label class="opt"><input type="checkbox" id="favOnly"> เฉพาะรายการโปรด</label>
    </div>
    <p class="count" id="count" role="status"></p>
    <ul class="grid" id="allList"></ul>
  </div>
</main>

<footer><div class="inner">รายการโปรดเก็บไว้ในเบราว์เซอร์ของคุณเท่านั้น</div></footer>

<dialog id="detailDlg" aria-labelledby="detailTitle">
  <div id="detailBody"></div>
  <button class="pill btn-close" id="detailClose" type="button">ปิด</button>
</dialog>

<dialog id="authDlg" aria-labelledby="authTitle">
  <h2 id="authTitle">สมัครสมาชิก</h2>
  <form id="authForm">
    <div id="authExtra" style="display:grid;gap:12px">
      <input id="authFirst" type="text" placeholder="ชื่อ" aria-label="ชื่อ" autocomplete="given-name" required>
      <input id="authLast" type="text" placeholder="นามสกุล" aria-label="นามสกุล" autocomplete="family-name" required>
      <input id="authPhone" type="tel" placeholder="เบอร์โทร" aria-label="เบอร์โทร" autocomplete="tel" pattern="[0-9+\- ]{9,15}" required>
    </div>
    <input id="authEmail" type="email" placeholder="อีเมล" aria-label="อีเมล" autocomplete="email" required>
    <input id="authPass" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)" aria-label="รหัสผ่าน" minlength="6" autocomplete="new-password" required>
    <button class="pill pill-primary" type="submit" id="authSubmit">สมัครสมาชิก</button>
    <button class="btn-clear" type="button" id="authSwitch">มีบัญชีแล้ว? เข้าสู่ระบบ</button>
    <p class="note" id="authMsg" role="status"></p>
  </form>
  <button class="pill btn-close" id="authClose" type="button">ปิด</button>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $ = id => document.getElementById(id);
const sb = supabase.createClient("https://roqdgdzknhljusijntyz.supabase.co", "sb_publishable_7_IxI4q3KCyeOgAAsuCiPQ_NLNoPZ4X");
let signup = true;
function authMode(s) {
  signup = s;
  $("authTitle").textContent = $("authSubmit").textContent = s ? "สมัครสมาชิก" : "เข้าสู่ระบบ";
  $("authExtra").hidden = !s;
  ["authFirst", "authLast", "authPhone"].forEach(id => $(id).required = s);
  $("authSwitch").textContent = s ? "มีบัญชีแล้ว? เข้าสู่ระบบ" : "ยังไม่มีบัญชี? สมัครสมาชิก";
  $("authMsg").textContent = "";
}
function authUI(user) {
  $("authBtn").textContent = user ? `ออกจากระบบ (${user.user_metadata?.first_name || user.email})` : "สมัครสมาชิก / เข้าสู่ระบบ";
}
$("authBtn").addEventListener("click", async () => {
  if ((await sb.auth.getSession()).data.session) return sb.auth.signOut();
  authMode(true); $("authDlg").showModal();
});
$("authSwitch").addEventListener("click", () => authMode(!signup));
$("authClose").addEventListener("click", () => $("authDlg").close());
$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("authEmail").value, password = $("authPass").value, msg = $("authMsg");
  msg.textContent = "กำลังดำเนินการ...";
  const { data, error } = signup
    ? await sb.auth.signUp({ email, password, options: { data: { first_name: $("authFirst").value.trim(), last_name: $("authLast").value.trim(), phone: $("authPhone").value.trim() } } })
    : await sb.auth.signInWithPassword({ email, password });
  if (error) { msg.textContent = error.message; return; }
  if (signup && !data.session) { msg.textContent = "สมัครสำเร็จ กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ"; return; }
  $("authForm").reset(); $("authDlg").close();
});
sb.auth.onAuthStateChange((_, s) => authUI(s?.user));

const CATEGORIES =["ทั้งหมด", ...new Set(DISHES.map(d => d.cat))];
const STORAGE_KEY = "thaiFoodFavorites";

const byId = new Map(DISHES.map(d => [d.id, d]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

let favorites = loadFavorites();
let lastPickId = null;
let activeCat = "ทั้งหมด";
let shuffling = false;

function loadFavorites() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (Array.isArray(raw)) return raw.filter(id => byId.has(id));
  } catch (e) {}
  return [];
}
function saveFavorites() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites)); } catch (e) {}
}
function isFav(id) { return favorites.includes(id); }
function toggleFav(id) {
  favorites = isFav(id) ? favorites.filter(f => f !== id) : [...favorites, id];
  saveFavorites();
  render();
}

function spiceText(n) { return n === 0 ? "ไม่เผ็ด" : "🌶️".repeat(n); }
function spiceLabel(n) { return n === 0 ? "ไม่เผ็ด" : "เผ็ด " + n + " จาก 3"; }

const IMG_SLUGS = {
  2: "kra-pao", 3: "pad-see-ew", 4: "pad-pak-boong", 5: "pad-prik-gaeng", 6: "khua-kling",
  7: "pad-kra-pao-goong", 8: "green-curry", 9: "massaman", 10: "panang", 11: "gaeng-som",

  27: "khao-niao-mamuang", 28: "bua-loi", 29: "tub-tim-grob", 30: "kluay-buat-chi"
};
function imgSrc(d) { return d.img || (IMG_SLUGS[d.id] ? `images/${IMG_SLUGS[d.id]}.jpg` : null); }
// ถ้าไฟล์รูปโหลดไม่ได้ ให้กลับไปแสดง emoji
function iconHTML(d) {
  const src = imgSrc(d);
  return src
    ? `<img src="${src}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'${d.emoji}'}))">`
    : `<span class="ph">${d.emoji}</span>`;
}

function rowHTML(d) {
  const on = isFav(d.id);
  return `<li class="card">
    <div class="card-img" aria-hidden="true">${iconHTML(d)}</div>
    <div class="card-body">
      <div class="card-head"><h3 class="card-name">${d.name}</h3>
      <button class="heart" type="button" data-fav="${d.id}" aria-pressed="${on}" aria-label="${on ? "เอา" + d.name + "ออกจากรายการโปรด" : "เพิ่ม" + d.name + "เป็นรายการโปรด"}">${on ? "♥" : "♡"}</button></div>
      <p class="card-meta">${d.cat} · <span role="img" aria-label="${spiceLabel(d.spice)}">${spiceText(d.spice)}</span></p>
      <p class="card-desc">${d.desc}</p>
      <button class="link" type="button" data-detail="${d.id}">ดูส่วนประกอบ →</button>
    </div>
  </li>`;
}
function setHero(d) { $("heroMedia").innerHTML = iconHTML(d); }

function renderPick() {
  const d = byId.get(lastPickId);
  if (!d) return;
  const on = isFav(d.id);
  setHero(d);
  $("pickBody").innerHTML = `<h1 class="pick-name">${d.name}</h1>
    <p class="pick-desc">${d.desc}</p>
    <div class="pick-meta"><span>${d.cat}</span><span role="img" aria-label="${spiceLabel(d.spice)}">${spiceText(d.spice)}</span>
    <button class="pill pick-heart" type="button" data-fav="${d.id}" aria-pressed="${on}">${on ? "♥ เป็นรายการโปรดแล้ว" : "♡ เพิ่มเป็นรายการโปรด"}</button>
    <button class="pill" type="button" data-detail="${d.id}">ดูส่วนประกอบ</button></div>`;
}
function renderFavs() {
  $("favList").innerHTML = favorites.length
    ? `<ul class="grid">${favorites.map(id => rowHTML(byId.get(id))).join("")}</ul>`
    : `<div class="empty">ยังไม่มีรายการโปรด กดหัวใจ ♡ ที่เมนูที่ชอบได้เลย</div>`;
}
function filteredDishes() {
  const q = $("q").value.trim().toLowerCase();
  const spice = $("spiceSel").value;
  const favOnly = $("favOnly").checked;
  return DISHES.filter(d =>
    (activeCat === "ทั้งหมด" || d.cat === activeCat) &&
    (spice === "" || d.spice === Number(spice)) &&
    (!favOnly || isFav(d.id)) &&
    (!q || (d.name + " " + d.desc + " " + d.cat).toLowerCase().includes(q)));
}
function hasFilter() {
  return $("q").value.trim() !== "" || $("spiceSel").value !== "" || $("favOnly").checked || activeCat !== "ทั้งหมด";
}
function clearFilters() {
  $("q").value = "";
  $("spiceSel").value = "";
  $("favOnly").checked = false;
  activeCat = "ทั้งหมด";
  renderFilters();
  renderAll();
}
function renderAll() {
  const list = filteredDishes();
  const clear = hasFilter() ? ` <button class="btn-clear" type="button" id="clearBtn">ล้างตัวกรอง</button>` : "";
  $("count").innerHTML = `พบ ${list.length} จาก ${DISHES.length} เมนู${clear}`;
  $("allList").innerHTML = list.length
    ? list.map(rowHTML).join("")
    : `<li class="empty">ไม่พบเมนูที่ตรงกับตัวกรอง ลองเปลี่ยนคำค้นหาหรือล้างตัวกรอง</li>`;
}
function renderFilters() {
  $("filters").innerHTML = CATEGORIES.map(c =>
    `<button class="tab" type="button" data-cat="${c}" aria-pressed="${c === activeCat}">${c}</button>`).join("");
}
function render() { if (!shuffling) renderPick(); renderFavs(); renderAll(); }

function randomPick() {
  if (shuffling) return;
  const note = $("note");
  note.textContent = "";
  const onlyFav = $("onlyFav").checked;
  let pool = onlyFav ? favorites.map(id => byId.get(id)) : DISHES;
  if (onlyFav && pool.length === 0) {
    note.textContent = "ยังไม่มีรายการโปรด กดหัวใจที่เมนูก่อน หรือปิดตัวเลือกนี้เพื่อสุ่มจากทั้งหมด";
    return;
  }
  if (pool.length > 1) pool = pool.filter(d => d.id !== lastPickId);
  else if (pool[0].id === lastPickId) note.textContent = "มีรายการโปรดเมนูเดียว จึงได้เมนูเดิม";
  const target = pool[Math.floor(Math.random() * pool.length)];

  if (reduceMotion.matches) { lastPickId = target.id; render(); return; }

  shuffling = true;
  $("randomBtn").disabled = true;
  const start = Date.now();
  const timer = setInterval(() => {
    const t = Date.now() - start;
    if (t >= 600) {
      clearInterval(timer);
      shuffling = false;
      $("randomBtn").disabled = false;
      lastPickId = target.id;
      render();
      return;
    }
    const d = DISHES[Math.floor(Math.random() * DISHES.length)];
    setHero(d);
    $("pickBody").innerHTML = `<p class="pick-name" aria-hidden="true">${d.name}</p><p class="pick-desc"></p>`;
  }, 70);
}

let detailOpener = null;
function listHTML(items) { return items.map(i => `<li>${i}</li>`).join(""); }
function openDetail(id, opener) {
  const d = byId.get(id), ing = INGREDIENTS[id];
  if (!d || !ing) return;
  detailOpener = opener;
  $("detailBody").innerHTML = `
    <div class="detail-top">
      <div class="detail-icon" aria-hidden="true">${iconHTML(d)}</div>
      <div><h2 id="detailTitle">${d.name}</h2>
      <p class="detail-meta">${d.cat} · <span role="img" aria-label="${spiceLabel(d.spice)}">${spiceText(d.spice)}</span></p></div>
    </div>
    <p>${d.desc}</p>
    <h3>วัตถุดิบหลัก</h3><ul class="chips">${listHTML(ing.main)}</ul>
    <h3>เครื่องปรุงและน้ำซอส</h3><ul class="chips">${listHTML(ing.season)}</ul>
    <h3>สารก่อภูมิแพ้ที่ควรระวัง</h3>
    ${ing.allergens.length ? `<ul class="chips warn">${listHTML(ing.allergens)}</ul>` : `<p class="detail-meta">ไม่พบสารก่อภูมิแพ้หลักในสูตรทั่วไป</p>`}`;
  $("detailDlg").showModal();
}

document.addEventListener("click", e => {
  const det = e.target.closest("[data-detail]");
  if (det) return openDetail(Number(det.dataset.detail), det);
  if (e.target.closest("#detailClose") || e.target === $("detailDlg")) return $("detailDlg").close();
  const fav = e.target.closest("[data-fav]");
  if (fav) return toggleFav(Number(fav.dataset.fav));
  const tab = e.target.closest("[data-cat]");
  if (tab) { activeCat = tab.dataset.cat; renderFilters(); renderAll(); return; }
  if (e.target.closest("#clearBtn")) clearFilters();
});
["q", "spiceSel", "favOnly"].forEach(id =>
  $(id).addEventListener(id === "q" ? "input" : "change", renderAll));
$("randomBtn").addEventListener("click", randomPick);
$("detailDlg").addEventListener("close", () => { if (detailOpener && detailOpener.isConnected) detailOpener.focus(); });

renderFilters();
render();
</script>
</body>
</html>
